name: 🧪 Python Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'python-tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'python-tests/**'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  POETRY_VERSION: '1.8.0'
  AUTH_URL: http://localhost:9000
  FRONTEND_URL: http://localhost
  GATEWAY_URL: http://localhost:8090
  TEST_USERNAME: test
  TEST_PASSWORD: 123
  SPEND_DB_URL: postgresql+psycopg2://postgres:secret@localhost:5432/niffler-spend
  USER_DB_URL: postgresql+psycopg2://postgres:secret@localhost:5432/niffler-userdata
  AUTH_SECRET: secret
  KAFKA_ADDRESS: localhost:9093
  GRPC_URL: localhost:8092

jobs:
  # ============================================
  # Job 1: Линтинг и проверка кода
  # ============================================
  lint:
    name: Линтинг и проверка кода
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout код
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Установка Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Кэширование зависимостей
        uses: actions/cache@v3
        with:
          path: |
            python-tests/.venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('python-tests/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Установка зависимостей
        working-directory: ./python-tests
        run: poetry install --with dev

      - name: Запуск Ruff
        working-directory: ./python-tests
        run: poetry run ruff check .
        continue-on-error: true

  # ============================================
  # Job 2: API тесты (REST, SOAP, gRPC)
  # ============================================
  api-tests:
    name: API тесты (REST/SOAP/gRPC)
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      fail-fast: false
      matrix:
        test-type: ['rest', 'soap', 'grpc']
    
    steps:
      - name: Checkout код
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Установка Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Кэширование зависимостей
        uses: actions/cache@v3
        with:
          path: |
            python-tests/.venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('python-tests/poetry.lock') }}

      - name: Установка зависимостей
        working-directory: ./python-tests
        run: poetry install

      - name: Запуск ${{ matrix.test-type }} тестов (параллельно)
        working-directory: ./python-tests
        run: |
          poetry run pytest tests/api/${{ matrix.test-type }}/ \
            -n auto \
            -v \
            --alluredir=allure-results \
            --tb=short
        continue-on-error: true

      - name: Загрузка Allure результатов
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.test-type }}
          path: python-tests/allure-results/
          retention-days: 7

  # ============================================
  # Job 3: UI тесты (Playwright)
  # ============================================
  ui-tests:
    name: UI тесты (Playwright)
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout код
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Установка Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Кэширование зависимостей
        uses: actions/cache@v3
        with:
          path: |
            python-tests/.venv
            ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('python-tests/poetry.lock') }}

      - name: Установка зависимостей
        working-directory: ./python-tests
        run: poetry install

      - name: Установка Playwright браузеров
        working-directory: ./python-tests
        run: poetry run playwright install chromium --with-deps

      - name: Запуск UI тестов (параллельно)
        working-directory: ./python-tests
        run: |
          poetry run pytest tests/ui/ \
            -n 2 \
            -v \
            --alluredir=allure-results \
            --tb=short
        continue-on-error: true

      - name: Загрузка скриншотов при ошибках
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-ui
          path: python-tests/artifacts/
          retention-days: 7

      - name: Загрузка Allure результатов
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-ui
          path: python-tests/allure-results/
          retention-days: 7

  # ============================================
  # Job 4: Генерация Allure отчета
  # ============================================
  allure-report:
    name: Генерация Allure отчета
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    
    steps:
      - name: Скачивание всех Allure результатов
        uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true

      - name: Генерация Allure отчета
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Публикация Allure отчета на GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          destination_dir: allure-report

      - name: Комментарий с ссылкой на отчет
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const reportUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-report`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Allure отчет готов!\n\n🔗 [Посмотреть отчет](${reportUrl})\n\n✅ Тесты завершены`
            });

  # ============================================
  # Job 5: Сводка по тестам
  # ============================================
  test-summary:
    name: Сводка по тестам
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    
    steps:
      - name: Вывод статуса тестов
        run: |
          echo "## Результаты тестирования" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Тип тестов | Статус |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API (REST) | ${{ needs.api-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API (SOAP) | ${{ needs.api-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API (gRPC) | ${{ needs.api-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI | ${{ needs.ui-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Использован параллельный запуск с pytest-xdist" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Посмотреть полный Allure отчет](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-report)" >> $GITHUB_STEP_SUMMARY

